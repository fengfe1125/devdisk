name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Catches a missing resource bundle or a broken Info.plist before a tag is
      # ever cut — both fail at launch rather than at build time.
      - name: Package
        run: ./package.sh -
